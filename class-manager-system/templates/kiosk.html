<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>一体机控制 · {{ system_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
    <style>
        .kc-bar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .kc-bar select {
            width: auto; flex: 0 1 380px; max-width: 420px;
            padding: 9px 12px; border: 1px solid var(--border);
            border-radius: 10px; background: #fbfcfe; font: inherit; font-size: 13.5px;
            color: var(--text); outline: none;
        }
        .kc-bar select:focus { border-color: var(--primary); background: #fff; }
        .kc-bar .spacer { flex: 1; }

        .kc-info {
            display: grid; grid-template-columns: 96px 1fr; gap: 8px 14px;
            font-size: 13px; margin: 0 0 22px;
        }
        .kc-info dt { color: var(--text-muted); }
        .kc-info dd { margin: 0; }

        .kc-sep { height: 1px; background: var(--border); margin: 0 0 20px; }

        .kc-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .kc-row input[type="text"] {
            flex: 1; min-width: 240px; padding: 9px 12px; border: 1px solid var(--border);
            border-radius: 10px; background: #fbfcfe; font: inherit; font-size: 13.5px; outline: none;
        }
        .kc-row input[type="text"]:focus { border-color: var(--primary); background: #fff; }

        .kc-out {
            background: #0f172a; color: #cbd5e1; border-radius: 10px; padding: 14px;
            font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
            white-space: pre-wrap; max-height: 280px; overflow: auto; min-height: 96px;
        }
        .kc-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .kc-sub { font-size: 14px; margin: 4px 0 12px; color: var(--text-strong); }
        .kc-screen + .kc-sub, .kc-row + .kc-sub { margin-top: 20px; }

        .kc-screen {
            background: #0f172a; border-radius: 12px; aspect-ratio: 16 / 10;
            display: flex; align-items: center; justify-content: center;
            color: #93a4bd; font-size: 13px; overflow: hidden;
        }
        .kc-screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .kc-hint { font-size: 12.5px; color: var(--text-muted); margin: 0 0 16px; }
    </style>
</head>
<body>
    <div class="app-shell">
        {% set active_page = 'kiosk' %}
        {% include "_sidebar.html" %}

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">一体机控制</h1>
            <p class="page-desc">选择教室后查看运行状态、测试播报，或向该一体机下发指令</p>
        </div>

        <div id="kEmpty" class="card kc-empty" hidden>
            还没有添加班级设备。<br><br>
            <a href="/setting#devices">前往「设置 → 班级设备」添加一体机的 IP 和访问密钥 →</a>
        </div>

        <section class="card" id="kPanel" hidden>
            <div class="kc-bar">
                <select id="kDevice"></select>
                <span class="status-pill" id="kPill">—</span>
                <span class="spacer"></span>
                <button type="button" class="btn btn-ghost btn-sm" id="kRefresh">刷新状态</button>
            </div>

            <dl class="kc-info" id="kInfo"></dl>

            <div class="kc-sep"></div>

            <p class="kc-hint">
                摄像头、麦克风、远程执行授权等设置只能在一体机本机操作，这里不提供远程修改。
            </p>

            <div class="kc-row">
                <button type="button" class="btn btn-danger" id="kShutdown">关机</button>
                <button type="button" class="btn btn-ghost" id="kReboot">重启</button>
                <button type="button" class="btn btn-ghost" id="kOpenUrl">打开网址</button>
            </div>

            <h3 class="kc-sub">远程设置</h3>
            <div class="kc-row">
                <button type="button" class="btn btn-ghost" id="kIdentify">测试播报</button>
                <button type="button" class="btn btn-ghost" id="kAutostart">开机自启</button>
                <button type="button" class="btn btn-ghost" id="kSettings">一体机设置</button>
            </div>

            <dialog id="setDlg" class="modal" style="width:min(460px,calc(100vw - 40px))">
                <form id="setForm" class="modal__body">
                    <h3 class="modal__title">一体机设置</h3>
                    <p class="modal__text">下发的设置会在该一体机上立即生效</p>

                    <div class="field">
                        <label class="field-label">教室 / 班级</label>
                        <input type="text" id="sRoom" placeholder="例如：三年级二班"
                               style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;outline:none">
                    </div>
                    <div class="field">
                        <label class="field-label">设备名称</label>
                        <input type="text" id="sName" placeholder="例如：3-2 一体机"
                               style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;outline:none">
                    </div>
                    <div class="field">
                        <label class="field-label">分辨率</label>
                        <select id="sRes" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;outline:none">
                            <option value="640x360">360P（640×360）</option>
                            <option value="1280x720">720P（1280×720）</option>
                            <option value="1920x1080">1080P（1920×1080）</option>
                            <option value="2560x1440">2K（2560×1440）</option>
                            <option value="3840x2160">4K（3840×2160）</option>
                        </select>
                    </div>
                    <div class="kc-row" style="margin-bottom:0">
                        <div style="flex:1">
                            <label class="field-label">帧率</label>
                            <input type="number" id="sFps" min="1" max="30" value="30"
                                   style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;outline:none">
                        </div>
                        <div style="flex:1">
                            <label class="field-label">画质</label>
                            <input type="number" id="sQuality" min="30" max="95" value="70"
                                   style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;outline:none">
                        </div>
                    </div>

                    <div class="modal__actions" style="margin-top:18px">
                        <button type="button" class="btn btn-ghost" id="sCancel">取消</button>
                        <button type="submit" class="btn">保存</button>
                    </div>
                </form>
            </dialog>

            <h3 style="font-size:14px;margin:0 0 12px;color:var(--text-strong)">屏幕直播</h3>
            <div class="kc-screen" id="kScreenBox">
                <span>正在获取画面…</span>
            </div>

            <div class="kc-sep" style="margin:22px 0 18px"></div>

            <h3 style="font-size:14px;margin:0 0 12px;color:var(--text-strong)">远程指令</h3>
            <div class="kc-row">
                <input type="text" id="kCmd" placeholder="指令内容，例如：ipconfig /all">
                <button type="button" class="btn" id="kExec">执行</button>
            </div>

            <div class="kc-out" id="kOut">等待操作…</div>
        </section>
    </main>

    </div>

<script>
(function () {
    var devices = {{ devices|tojson }};
    var csrf = {{ csrf_token|tojson }};
    var emptyEl = document.getElementById('kEmpty');
    var panelEl = document.getElementById('kPanel');
    var sel = document.getElementById('kDevice');
    var out = document.getElementById('kOut');
    var current = null;
    var autoStartOn = false;
    var lastDetail = null;

    if (!devices.length) { emptyEl.hidden = false; return; }
    panelEl.hidden = false;

    devices.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d.id;
        o.textContent = (d.name || d.host) + (d.room ? '（' + d.room + '）' : '');
        sel.appendChild(o);
    });

    sel.addEventListener('change', function () {
        current = devices.filter(function (d) { return d.id === sel.value; })[0] || null;
        out.textContent = '等待操作…';
        refresh();
        attachScreen();
    });

    function row(k, v) { return '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>'; }

    function attachScreen() {
        if (!current) return;
        var box = document.getElementById('kScreenBox');
        box.innerHTML = '<span>正在获取画面…</span>';

        var img = document.createElement('img');
        img.alt = '屏幕直播';
        img.src = '/device/' + current.id + '/screen?t=' + Date.now();
        img.onerror = function () {
            box.innerHTML = '<span>屏幕画面获取失败，5 秒后重试…</span>';
            setTimeout(function () { if (current) attachScreen(); }, 5000);
        };
        img.onload = function () { box.innerHTML = ''; box.appendChild(img); };
        box.appendChild(img);
    }

    function refresh() {
        if (!current) return;
        fetch('/device/' + current.id + '/status')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (st) {
                if (!st) return;

                var pill = document.getElementById('kPill');
                var online = st.reachable || (st.video && st.video.online);
                pill.className = 'status-pill ' + (online ? 'status-pill--ok' : 'status-pill--bad');
                pill.textContent = online ? '在线' : (st.error ? '连接失败' : '离线');

                var ag = st.detail || {};
                lastDetail = ag;
                var cam = ag.camera || {};
                var mic = ag.mic || {};
                var rem = ag.remote || {};
                var vid = st.video || {};

                document.getElementById('kInfo').innerHTML =
                    row('设备名', (st.agent && st.agent.device) || '—') +
                    row('教室', st.room || '未设置') +
                    row('地址', st.host + ':' + st.port) +
                    row('摄像头', cam.enabled ? ('开 · ' + (cam.current || '') + ' · ' + (cam.actualFps || 0) + ' fps') : '关') +
                    row('麦克风', mic.enabled ? ('开 · ' + (mic.current || '')) : '关') +
                    row('远程执行', rem.enabled ? '已授权（本机开启）' : '未授权') +
                    row('UDP 视频', (vid.online ? '接收中' : '无数据') + ' · ' + (vid.fps || 0) + ' fps');

                autoStartOn = !!(ag && ag.autostart);
                document.getElementById('kAutostart').textContent =
                    autoStartOn ? '开机自启：已开启' : '开机自启：已关闭';

                if (st.error) out.textContent = st.error;
            })
            .catch(function () { });
    }

    function postAction(action, payload) {
        var body = new URLSearchParams();
        body.set('action', action);
        body.set('csrf_token', csrf);
        body.set('text', (payload && payload.text) || '');
        body.set('command', (payload && payload.command) || '');
        return fetch('/device/' + current.id + '/action', {
            method: 'POST', body: body, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); });
    }

    document.getElementById('kAutostart').onclick = function () {
        if (!current) return;
        var target = !autoStartOn;
        var body = new URLSearchParams();
        body.set('action', 'autostart');
        body.set('csrf_token', csrf);
        body.set('enabled', target ? '1' : '0');
        out.textContent = target ? '正在开启开机自启…' : '正在关闭开机自启…';

        fetch('/device/' + current.id + '/action', {
            method: 'POST', body: body, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); })
          .then(function (res) {
              out.textContent = JSON.stringify(res, null, 2);
              refresh();
          })
          .catch(function (e) { out.textContent = '失败：' + e; });
    };

    document.getElementById('kReboot').onclick = function () {
        if (!current) return;
        var name = current.name || current.host;
        if (!confirm('确定重启「' + name + '」这台一体机？\n\n整台电脑会重启，该设备会离线约 1 分钟。')) return;

        var body = new URLSearchParams();
        body.set('action', 'reboot');
        body.set('csrf_token', csrf);
        out.textContent = '正在重启…';

        fetch('/device/' + current.id + '/action', {
            method: 'POST', body: body, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); })
          .then(function (res) {
              out.textContent = JSON.stringify(res, null, 2) + '\n\n设备正在重启，约 1 分钟后自动刷新状态…';
              setTimeout(refresh, 60000);
          })
          .catch(function (e) { out.textContent = '失败：' + e; });
    };

    document.getElementById('kShutdown').onclick = function () {
        if (!current) return;
        var name = current.name || current.host;
        if (!confirm('确定关闭「' + name + '」这台一体机？\n\n关机后该设备会离线，' +
                     '需要到教室按电源键手动开机。')) return;

        var body = new URLSearchParams();
        body.set('action', 'shutdown');
        body.set('csrf_token', csrf);
        out.textContent = '正在发送关机指令…';

        fetch('/device/' + current.id + '/action', {
            method: 'POST', body: body, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); })
          .then(function (res) {
              out.textContent = JSON.stringify(res, null, 2) + '\n\n设备即将关机并离线。';
              setTimeout(refresh, 6000);
          })
          .catch(function (e) { out.textContent = '失败：' + e; });
    };

    document.getElementById('kOpenUrl').onclick = function () {
        if (!current) return;
        var url = 'http://' + current.host + ':' + current.port + '/';
        if (!confirm('将在新标签页打开「' + (current.name || current.host) + '」的本地页面：\n\n' + url + '\n\n继续？')) return;
        window.open(url, '_blank');
    };

    // ---- 一体机设置弹窗 ----
    var setDlg = document.getElementById('setDlg');
    var setForm = document.getElementById('setForm');

    document.getElementById('kSettings').onclick = function () {
        if (!current) return;
        var ag = lastDetail || {};
        var cam = ag.camera || {};

        document.getElementById('sRoom').value = ag.room || '';
        document.getElementById('sName').value = ag.device || '';

        var key = (cam.width || 1280) + 'x' + (cam.height || 720);
        var sel = document.getElementById('sRes');
        var matched = false;
        for (var i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === key) { sel.value = key; matched = true; break; }
        }
        if (!matched) sel.value = '1280x720';

        document.getElementById('sFps').value = cam.fps || 30;
        document.getElementById('sQuality').value = cam.quality || 70;

        setDlg.showModal();
    };

    document.getElementById('sCancel').onclick = function () { setDlg.close(); };

    setForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!current) return;

        var res = document.getElementById('sRes').value.split('x');
        var body = new URLSearchParams();
        body.set('csrf_token', csrf);
        body.set('room_name', document.getElementById('sRoom').value.trim());
        body.set('device_name', document.getElementById('sName').value.trim());
        body.set('width', res[0]);
        body.set('height', res[1]);
        body.set('fps', document.getElementById('sFps').value || 30);
        body.set('quality', document.getElementById('sQuality').value || 70);

        fetch('/device/' + current.id + '/settings', {
            method: 'POST', body: body, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); })
          .then(function (r2) {
              setDlg.close();
              out.textContent = JSON.stringify(r2, null, 2);
              refresh();
          })
          .catch(function (err) {
              out.textContent = '保存失败：' + err;
          });
    });

    document.getElementById('kIdentify').onclick = function () {
        if (!current) return;
        out.textContent = '正在发送测试播报…';
        postAction('identify').then(function (res) {
            out.textContent = JSON.stringify(res, null, 2);
        }).catch(function (e) { out.textContent = '失败：' + e; });
    };

    document.getElementById('kExec').onclick = function () {
        if (!current) return;
        var cmd = (document.getElementById('kCmd').value || '').trim();
        if (!cmd) { document.getElementById('kCmd').focus(); return; }

        out.textContent = '执行中…';
        this.disabled = true;
        var btn = this;
        postAction('exec', { command: cmd }).then(function (res) {
            btn.disabled = false;
            out.textContent = JSON.stringify(res, null, 2);
        }).catch(function (e) {
            btn.disabled = false;
            out.textContent = '失败：' + e;
        });
    };

    document.getElementById('kRefresh').onclick = refresh;

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    current = devices[0];
    sel.value = current.id;
    refresh();
    attachScreen();
    setInterval(refresh, 4000);
})();
</script>
</body>
</html>
