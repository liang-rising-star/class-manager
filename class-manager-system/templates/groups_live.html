<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>小组换座 · {{ system_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
    <style>
        .live-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .live-toolbar input[type="number"] {
            width: 88px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
            background: #fbfcfe; font: inherit; font-size: 13.5px; outline: none;
        }
        .live-toolbar input[type="number"]:focus { border-color: var(--primary); }

        .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .live-card {
            border: 1px solid var(--border); border-radius: 16px; background: #fbfcfe;
            padding: 16px 18px;
        }
        .live-card__title {
            font-size: 15px; font-weight: 700; color: var(--primary);
            margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .live-card__title span { font-size: 12px; font-weight: 400; color: var(--text-muted); }
        .live-members { display: flex; flex-wrap: wrap; gap: 6px; }
        .live-chip {
            padding: 5px 11px; border-radius: 999px; background: #fff;
            border: 1px solid var(--border); font-size: 14px;
        }
        .live-chip .g { font-size: 11.5px; color: var(--text-muted); margin-left: 4px; }

        .live-hint { text-align: center; padding: 44px 20px; color: var(--text-muted); font-size: 13.5px; line-height: 1.9; }
        .live-hint b { color: var(--text); }
    </style>
</head>
<body>
    <div class="app-shell">
        {% set active_page = 'groups_live' %}
        {% include "_sidebar.html" %}

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">小组换座</h1>
            <p class="page-desc">课堂现场随机换座分组，一键换一批，结果不会保存到名单</p>
        </div>

        <section class="card">
            <div class="live-toolbar" style="margin-bottom:0">
                <span style="font-size:13.5px;color:var(--text-muted)">分成</span>
                <input type="number" id="liveCount" min="2" max="12" value="4">
                <span style="font-size:13.5px;color:var(--text-muted)">组</span>
                <button type="button" class="btn btn-sm" id="liveGo">开始分组</button>
                <button type="button" class="btn btn-ghost btn-sm" id="liveAgain" disabled>重新随机</button>
                <span style="flex:1"></span>
                <span style="font-size:13px;color:var(--text-muted)">名单里共 {{ total }} 名学生</span>
            </div>
        </section>

        <div id="liveResult">
            <div class="live-hint">
                选好组数，点「开始分组」现场随机分一次。<br>
                想换一批直接点「重新随机」。
            </div>
        </div>
    </main>
    </div>

<script>
(function () {
    var csrf = {{ csrf_token|tojson }};
    var total = {{ total }};
    var resultEl = document.getElementById('liveResult');
    var countEl = document.getElementById('liveCount');
    var againBtn = document.getElementById('liveAgain');

    function shuffle() {
        if (!total) {
            appAlert({ title: '名单是空的', text: '先到「学生名单」里导入或手动添加学生。' });
            return;
        }

        var fd = new FormData();
        fd.append('csrf_token', csrf);
        fd.append('count', countEl.value || 2);

        fetch('/groups/live/shuffle', { method: 'POST', body: fd, headers: { 'X-Requested-With': 'fetch' } })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.ok) { appAlert({ title: '分组失败', text: res.error || '' }); return; }
                render(res.groups);
                againBtn.disabled = false;
            })
            .catch(function (err) { appAlert({ title: '分组失败', text: String(err) }); });
    }

    function render(groups) {
        resultEl.innerHTML = '<div class="live-grid">' + groups.map(function (g) {
            var members = g.members.map(function (st) {
                return '<span class="live-chip">' + esc(st.name) +
                    (st.gender ? '<span class="g">' + esc(st.gender) + '</span>' : '') + '</span>';
            }).join('');

            return '<section class="live-card">' +
                '<div class="live-card__title">第 ' + g.index + ' 组 <span>' + g.members.length + ' 人</span></div>' +
                '<div class="live-members">' + (members || '<span class="live-chip">空</span>') + '</div>' +
                '</section>';
        }).join('') + '</div>';
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    document.getElementById('liveGo').onclick = shuffle;
    againBtn.onclick = shuffle;
    countEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); shuffle(); }
    });
})();
</script>
</body>
</html>
