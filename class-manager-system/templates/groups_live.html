<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>小组换座 · {{ system_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
    <script src="/static/js/drag.js?v={{ css_version }}"></script>
    <style>
        .live-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .live-toolbar select {
            width: auto; min-width: 190px; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 10px; background: #fbfcfe; font: inherit; font-size: 13.5px; outline: none;
        }
        .live-toolbar select:focus { border-color: var(--primary); }
        .live-toolbar .spacer { flex: 1; }
        .live-toolbar .lbl { font-size: 13px; color: var(--text-muted); }

        .score-list { display: flex; flex-direction: column; gap: 8px; }
        .score-row {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fbfcfe;
        }
        .score-row .gname { font-weight: 650; font-size: 14px; min-width: 84px; }
        .score-row .gmeta { font-size: 12.5px; color: var(--text-muted); flex: 1; }
        .score-row input[type="number"] {
            width: 86px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
            background: #fff; font: inherit; font-size: 14px; text-align: right; outline: none;
        }
        .score-row input[type="number"]:focus { border-color: var(--primary); }
        .score-row .rank {
            width: 26px; height: 26px; border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700;
            background: #eef1f6; color: #64748b; flex: 0 0 auto;
        }
        .score-row.is-top .rank { background: #fef3c7; color: #b45309; }

        .tray {
            display: flex; flex-wrap: wrap; gap: 10px; min-height: 66px;
            padding: 12px; border: 1px dashed var(--border-strong, #cbd5e1);
            border-radius: 12px; background: #fbfcfe;
        }
        .tray.is-drop { border-color: var(--primary); background: #f5f9ff; }
        .tray-hint { font-size: 12.5px; color: var(--text-faint); align-self: center; }

        /* ---------- 座位画布：自由摆放 ---------- */
        .seat-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 10px; }
        .seat-toolbar .spacer { flex: 1; }
        .seat-toolbar .tip { font-size: 12.5px; color: var(--text-muted); }

        .seat-canvas {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            border-radius: 14px; background: #f8fafc;
            border: 1px dashed var(--border-strong, #cbd5e1);
            overflow: hidden; touch-action: none;
        }
        .seat-canvas.is-editing {
            background: #f5f9ff repeating-linear-gradient(0deg, transparent, transparent 39px,
                        rgba(148,163,184,.12) 40px),
                        repeating-linear-gradient(90deg, transparent, transparent 39px,
                        rgba(148,163,184,.12) 40px);
            border-color: var(--primary);
        }

        .seat-box {
            position: absolute; box-sizing: border-box;
            padding: 4px 6px; border-radius: 10px;
            background: #fff; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 3px;
            overflow: hidden; font-size: 11.5px;
            transition: box-shadow .12s, border-color .12s;
        }
        .seat-box__label {
            font-size: 10px; color: var(--text-faint); display: flex; align-items: center; gap: 4px;
            flex: 0 0 auto; white-space: nowrap; overflow: hidden;
        }
        .seat-box__body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
        .seat-box__empty { font-size: 10.5px; color: var(--text-faint); }
        .seat-box.is-drop { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.18); }

        .is-editing .seat-box {
            cursor: grab; border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(37,99,235,.15);
        }
        .is-editing .seat-box:active { cursor: grabbing; }
        .seat-box.is-dragging { opacity: .55; z-index: 5; }
        .seat-box .move { color: var(--primary); font-size: 11px; }

        .canvas-empty {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            font-size: 13px; color: var(--text-faint);
        }

        .tile {
            border: 1px solid var(--border); border-radius: 10px; background: #fff;
            padding: 6px 9px; font-size: 13px; cursor: grab; min-width: 108px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .06); touch-action: none;
        }

        /* 座位里的组（比待放区更紧凑） */
        .seat-box .tile {
            border: 0; box-shadow: none; padding: 0; background: transparent;
            min-width: 0; font-size: 11.5px;
        }
        /* 座位里：上边组名，下边分数 */
        .seat-name {
            font-size: 12.5px; font-weight: 700; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.35;
        }
        .seat-score {
            font-size: 11px; color: var(--primary); font-weight: 600;
            margin-top: 2px; white-space: nowrap;
        }

        .seat-box .tile__name { font-size: 10.5px; }
        .seat-box .tile__score { font-size: 9px; }
        .seat-box .tile__members {
            font-size: 9px; line-height: 1.3; margin-top: 1px;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tile:active { cursor: grabbing; }
        .tile.is-dragging { opacity: .4; }
        .tile__head { display: flex; align-items: baseline; gap: 8px; }
        .tile__name { font-weight: 700; }
        .tile__score { font-size: 12px; color: var(--primary); }
        .tile__members { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }

        .drag-ghost { border-radius: 10px; }

        .cast-tip { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; }
        .cast-tip b { color: var(--primary); }
        .pill-on { background: #dcfce7; color: #15803d; }
        .btn.is-on { box-shadow: inset 0 0 0 2px rgba(37,99,235,.35); }
    </style>
</head>
<body>
    <div class="app-shell">
        {% set active_page = 'groups_live' %}
        {% include "_sidebar.html" %}

    <main class="page" id="pageRoot">
        <div class="page-head">
            <h1 class="page-title">小组换座</h1>
            <p class="page-desc">打分数 → 按分数排序 → 拖进座位 → 投屏到一体机</p>
        </div>

        <section class="card">
            <div class="live-toolbar" style="margin-bottom:0">
                <span class="lbl">投屏到</span>
                <select id="devSel"></select>
                <button type="button" class="btn btn-sm" id="showRankBtn">展示排名</button>
                <button type="button" class="btn btn-sm" id="showSeatsBtn">展示座位</button>
                <button type="button" class="btn btn-ghost btn-sm" id="stopCastBtn" style="display:none">停止投屏</button>
                <span class="status-pill" id="castPill" hidden>正在投屏</span>
            </div>
            <div class="cast-tip">点「展示排名」或「展示座位」后，一体机全屏显示；之后改分数、拖座位都会<b>实时同步</b>，不用再点。</div>
        </section>

        <section class="card">
            <div class="card-title">① 打分数</div>
            <div class="score-list" id="scoreList">
                <div class="tray-hint">还没有小组，先去「小组分配」里建组。</div>
            </div>
            <div class="live-toolbar" style="margin:14px 0 0">
                <button type="button" class="btn btn-sm" id="sortBtn">按分数排序</button>
                <button type="button" class="btn btn-ghost btn-sm" id="resetScoreBtn">清空分数</button>
            </div>
        </section>

        <section class="card">
            <div class="card-title">② 拖进座位</div>
            <div class="tray" id="tray">
                <span class="tray-hint">把小组拖到下面的座位里</span>
            </div>

            <div class="seat-toolbar">
                <button type="button" class="btn btn-ghost btn-sm" id="layoutBtn">布局设置</button>
                <button type="button" class="btn btn-sm" id="layoutDoneBtn" style="display:none">完成</button>
                <button type="button" class="btn btn-ghost btn-sm" id="resetLayoutBtn" style="display:none">恢复默认</button>
                <span class="spacer"></span>
                <span class="tip" id="layoutTip">点「布局设置」后，可以随意拖动座位方块，想放哪就放哪。</span>
            </div>

            <div class="seat-canvas" id="seatCanvas"></div>
        </section>
    </main>
    </div>

<script>
(function () {
    var csrf = {{ csrf_token|tojson }};
    var devices = {{ devices|tojson }};

    var devSel = document.getElementById('devSel');
    var scoreList = document.getElementById('scoreList');
    var tray = document.getElementById('tray');
    var canvas = document.getElementById('seatCanvas');
    var layoutBtn = document.getElementById('layoutBtn');
    var layoutDoneBtn = document.getElementById('layoutDoneBtn');
    var resetLayoutBtn = document.getElementById('resetLayoutBtn');
    var layoutTip = document.getElementById('layoutTip');
    var showRankBtn = document.getElementById('showRankBtn');
    var showSeatsBtn = document.getElementById('showSeatsBtn');
    var stopCastBtn = document.getElementById('stopCastBtn');
    var castPill = document.getElementById('castPill');

    // 座位方块：宽度按画布百分比，高度换算成同样像素 → 正方形
    var BOX_W = 14.5;      // 一行能放下 6 个
    var BOX_H = 25.8;      // 由 BOX_W 与 16:9 画布推出，render 时刷新

    var groups = [];
    var seatCount = 0;
    var seatPos = [];        // [ {x, y} ] 左上角百分比
    var placed = {};         // 座位序号 -> groupId
    var layoutMode = false;

    var STORE_KEY = 'cm.seatLayout.v2';

    // ---------------- 设备 ----------------
    devices.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d.id;
        o.textContent = (d.name || d.host) + (d.room ? '（' + d.room + '）' : '');
        devSel.appendChild(o);
    });
    if (!devices.length) {
        devSel.innerHTML = '<option value="">无设备，请先在设置里添加</option>';
        showRankBtn.disabled = true;
        showSeatsBtn.disabled = true;
    }

    // ---------------- 位置 ----------------
    function defaultPositions(from) {
        from = from || 0;
        syncBoxHeight();

        var perRow = Math.min(6, Math.max(1, seatCount));
        var rows = Math.ceil(seatCount / perRow);
        var gapX = (100 - perRow * BOX_W) / (perRow + 1);
        var gapY = (100 - rows * BOX_H) / (rows + 1);

        seatPos = seatPos.slice(0, from);

        for (var i = from; i < seatCount; i++) {
            var r = Math.floor(i / perRow);
            var c = i % perRow;
            var p = { x: gapX + c * (BOX_W + gapX), y: gapY + r * (BOX_H + gapY) };

            // 和已有座位重叠就另找一个空位（小组变多、后加的座位用得上）
            p = clampPos(p);
            seatPos.push(i < perRow * rows && !hitsAny(p) ? p : findFreePos());
        }

        seatPos.length = seatCount;
    }

    function hitsAny(p) {
        return seatPos.some(function (q) { return overlaps(p, q); });
    }

    function overlaps(a, b) {
        return !(a.x + BOX_W <= b.x || b.x + BOX_W <= a.x ||
                 a.y + BOX_H <= b.y || b.y + BOX_H <= a.y);
    }

    /// 在画布上找一个不和现有座位重叠的位置
    function findFreePos() {
        syncBoxHeight();
        var cols = 6, rows = 3;
        var gapX = (100 - cols * BOX_W) / (cols + 1);
        var gapY = (100 - rows * BOX_H) / (rows + 1);

        for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
                var p = clampPos({ x: gapX + c * (BOX_W + gapX), y: gapY + r * (BOX_H + gapY) });
                if (!hitsAny(p)) return p;
            }
        }

        // 实在挤满就错开一点放
        var n = seatPos.length;
        return clampPos({ x: (n * 7) % (100 - BOX_W), y: (n * 11) % (100 - BOX_H) });
    }

    /// 画布宽度百分比 → 换算成等高（正方形）所需的高度百分比
    function syncBoxHeight() {
        var r = canvas.getBoundingClientRect();
        BOX_H = r.height > 0 ? (r.width * BOX_W / 100) / r.height * 100 : BOX_W * 16 / 9;
    }

    function clampPos(p) {
        return {
            x: Math.max(0, Math.min(100 - BOX_W, p.x)),
            y: Math.max(0, Math.min(100 - BOX_H, p.y))
        };
    }

    function loadLayout() {
        try {
            var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
            if (saved && Array.isArray(saved.pos) && saved.pos.length) {
                seatPos = saved.pos.slice(0, seatCount).map(clampPos);

                // 小组变多了：多出来的座位按默认位置补上
                if (seatPos.length < seatCount) {
                    defaultPositions(seatPos.length);
                }
                return seatPos.length > 0;
            }
        } catch (e) { }
        return false;
    }

    function saveLayout() {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify({ pos: seatPos }));
        } catch (e) { }
    }

    // ---------------- 加载小组 ----------------
    function load() {
        fetch('/groups/list.json?t=' + Date.now())
            .then(function (r) { return r.json(); })
            .then(function (data) {
                groups = (data.groups || []).map(function (g) {
                    return { id: g.id, name: g.name, members: g.members || [], score: '' };
                });
                seatCount = groups.length;   // 有几个小组就给几个座位
                placed = {};

                if (!loadLayout()) defaultPositions();

                if (!groups.length) {
                    scoreList.innerHTML = '<div class="tray-hint">还没有小组，先去「小组分配」里建组。</div>';
                }
                renderScores();
                renderAll();
            })
            .catch(function () { });
    }

    // ---------------- 打分区 ----------------
    function sortedGroups() {
        return groups.slice().sort(function (a, b) {
            var sa = a.score === '' ? -Infinity : Number(a.score);
            var sb = b.score === '' ? -Infinity : Number(b.score);
            if (sb !== sa) return sb - sa;
            return a.name.localeCompare(b.name, 'zh-CN');
        });
    }

    function renderScores() {
        if (!groups.length) return;
        scoreList.innerHTML = '';

        sortedGroups().forEach(function (g, i) {
            var row = document.createElement('div');
            row.className = 'score-row' + (i === 0 && g.score !== '' ? ' is-top' : '');
            row.dataset.gid = g.id;
            row.innerHTML =
                '<span class="rank">' + (i + 1) + '</span>' +
                '<span class="gname">' + esc(g.name) + '</span>' +
                '<span class="gmeta">' + g.members.length + ' 人 · ' +
                    g.members.map(function (m) { return esc(m.name); }).join('、') + '</span>' +
                '<input type="number" step="0.5" placeholder="分数" value="' + esc(g.score) + '">';

            row.querySelector('input').addEventListener('input', function () {
                g.score = this.value;
                schedulePush();
            });
            row.querySelector('input').addEventListener('change', function () {
                renderScores();
                renderAll();
                schedulePush();
            });

            scoreList.appendChild(row);
        });
    }

    document.getElementById('sortBtn').onclick = function () {
        renderScores();
        renderAll();
    };

    document.getElementById('resetScoreBtn').onclick = function () {
        groups.forEach(function (g) { g.score = ''; });
        renderScores();
        renderAll();
        schedulePush();
    };

    // ---------------- 座位 ----------------
    function groupById(gid) {
        return groups.filter(function (x) { return x.id === gid; })[0];
    }

    function seatOfGroup(gid) {
        for (var k in placed) {
            if (placed[k] === gid) return parseInt(k, 10);
        }
        return null;
    }

    function renderTray() {
        var left = sortedGroups().filter(function (g) { return seatOfGroup(g.id) === null; });
        tray.innerHTML = '';

        if (!left.length) {
            tray.innerHTML = '<span class="tray-hint">' +
                (groups.length ? '所有小组都已入座' : '还没有小组') + '</span>';
            return;
        }

        left.forEach(function (g) { tray.appendChild(makeTile(g)); });
    }

    function makeTile(g) {
        var el = document.createElement('div');
        el.className = 'tile';
        el.dataset.gid = g.id;

        el.innerHTML =
            '<div class="tile__head">' +
                '<span class="tile__name">' + esc(g.name) + '</span>' +
                (g.score !== '' ? '<span class="tile__score">' + esc(g.score) + ' 分</span>' : '') +
            '</div>' +
            '<div class="tile__members">' +
                (g.members.map(function (m) { return esc(m.name); }).join('、') || '空组') +
            '</div>';

        return el;
    }

    function renderCanvas() {
        syncBoxHeight();
        canvas.innerHTML = '';

        if (!seatCount) {
            canvas.innerHTML = '<div class="canvas-empty">还没有小组，先去「小组分配」里建组</div>';
            return;
        }

        for (var i = 0; i < seatCount; i++) {
            var p = seatPos[i] || { x: 0, y: 0 };
            var gid = placed[i];
            var g = gid ? groupById(gid) : null;

            var box = document.createElement('div');
            box.className = 'seat-box';
            box.dataset.seat = i;
            box.style.left = p.x + '%';
            box.style.top = p.y + '%';
            box.style.width = BOX_W + '%';
            box.style.height = BOX_H + '%';
            box.style.aspectRatio = '1 / 1';

            box.innerHTML =
                '<div class="seat-box__label">座位 ' + (i + 1) +
                    (layoutMode ? '<span class="move">⠿ 拖动</span>' : '') + '</div>' +
                '<div class="seat-box__body">' +
                    (g
                        ? '<div class="tile" data-gid="' + g.id + '" style="min-width:0;border:0;box-shadow:none;padding:0;background:transparent">' +
                              '<div class="seat-name">' + esc(g.name) + '</div>' +
                              '<div class="seat-score">' +
                                  (g.score !== '' ? esc(g.score) + ' 分' : '未打分') +
                              '</div>' +
                          '</div>'
                        : '<div class="seat-box__empty">拖个小组进来</div>') +
                '</div>';

            canvas.appendChild(box);
        }
    }

    function renderAll() {
        renderTray();
        renderCanvas();
        schedulePush();
    }

    // ---------------- 拖动：小组 → 座位 ----------------
    createPointerDrag({
        itemSelector: '.tile',
        zoneSelector: '.seat-box, .tray',
        canDrag: function () { return !layoutMode; },
        onDrop: function (tileEl, zoneEl) {
            var gid = parseInt(tileEl.dataset.gid, 10);
            if (!gid) return;

            var from = seatOfGroup(gid);
            if (from !== null) delete placed[from];

            if (zoneEl.classList.contains('seat-box')) {
                var seatIdx = parseInt(zoneEl.dataset.seat, 10);
                var occupant = placed[seatIdx];
                placed[seatIdx] = gid;

                if (occupant && occupant !== gid && from !== null) {
                    placed[from] = occupant;
                }
            }

            renderAll();
        }
    });

    // ---------------- 自由摆放座位 ----------------
    var freeDrag = null;

    canvas.addEventListener('mousedown', function (e) {
        if (!layoutMode) return;

        var box = e.target.closest('.seat-box');
        if (!box) return;

        e.preventDefault();

        var rect = canvas.getBoundingClientRect();
        var br = box.getBoundingClientRect();

        freeDrag = {
            box: box,
            seat: parseInt(box.dataset.seat, 10),
            rect: rect,
            offX: e.clientX - br.left,
            offY: e.clientY - br.top
        };

        box.classList.add('is-dragging');
        document.addEventListener('mousemove', onFreeMove, true);
        document.addEventListener('mouseup', onFreeUp, true);
    });

    function onFreeMove(e) {
        if (!freeDrag) return;
        e.preventDefault();

        var rect = freeDrag.rect;
        var x = (e.clientX - rect.left - freeDrag.offX) / rect.width * 100;
        var y = (e.clientY - rect.top - freeDrag.offY) / rect.height * 100;

        var p = clampPos({ x: x, y: y });
        seatPos[freeDrag.seat] = p;

        freeDrag.box.style.left = p.x + '%';
        freeDrag.box.style.top = p.y + '%';
    }

    function onFreeUp() {
        document.removeEventListener('mousemove', onFreeMove, true);
        document.removeEventListener('mouseup', onFreeUp, true);

        if (freeDrag) {
            freeDrag.box.classList.remove('is-dragging');
            freeDrag = null;
            saveLayout();
            schedulePush();
        }
    }

    // ---------------- 布局设置 ----------------
    layoutBtn.onclick = function () {
        layoutMode = true;
        canvas.classList.add('is-editing');
        layoutBtn.style.display = 'none';
        layoutDoneBtn.style.display = '';
        resetLayoutBtn.style.display = '';
        layoutTip.textContent = '布局设置中：直接拖动座位方块，想放哪就放哪，「完成」后保存。';
        renderCanvas();
    };

    layoutDoneBtn.onclick = function () {
        layoutMode = false;
        canvas.classList.remove('is-editing');
        layoutBtn.style.display = '';
        layoutDoneBtn.style.display = 'none';
        resetLayoutBtn.style.display = 'none';
        layoutTip.textContent = '点「布局设置」后，可以随意拖动座位方块，想放哪就放哪。';
        saveLayout();
        renderCanvas();
    };

    resetLayoutBtn.onclick = function () {
        defaultPositions();
        saveLayout();
        renderCanvas();
    };

    // ---------------- 投屏 ----------------
    function buildRankPayload() {
        var items = sortedGroups().map(function (g, i) {
            return {
                rank: i + 1,
                name: g.name,
                score: g.score,
                members: g.members
            };
        });

        return {
            mode: 'rank',
            title: '小组排名',
            subtitle: new Date().toLocaleDateString('zh-CN'),
            items: items
        };
    }

    function buildSeatsPayload() {
        var slots = [];

        for (var i = 0; i < seatCount; i++) {
            var p = seatPos[i] || { x: 0, y: 0 };
            var g = groupById(placed[i]);

            slots.push({
                seat: '座位 ' + (i + 1),
                x: p.x,
                y: p.y,
                w: BOX_W,
                h: BOX_H,
                name: g ? g.name : '',
                score: g ? g.score : '',
                members: g ? g.members : []
            });
        }

        return {
            mode: 'seats',
            title: '小组换座',
            subtitle: new Date().toLocaleDateString('zh-CN'),
            slots: slots
        };
    }

    var castMode = null;       // null / 'rank' / 'seats'
    var pushTimer = null;

    function setCastPill(mode) {
        if (!mode) {
            castPill.hidden = true;
            stopCastBtn.style.display = 'none';
            showRankBtn.classList.remove('is-on');
            showSeatsBtn.classList.remove('is-on');
            return;
        }
        castPill.hidden = false;
        castPill.className = 'status-pill pill-on';
        castPill.textContent = mode === 'rank' ? '投屏中 · 排名' : '投屏中 · 座位';
        stopCastBtn.style.display = '';
        showRankBtn.classList.toggle('is-on', mode === 'rank');
        showSeatsBtn.classList.toggle('is-on', mode === 'seats');
    }

    /// 数据一变就推，350ms 内合并多次改动
    function schedulePush() {
        if (!castMode) return;
        clearTimeout(pushTimer);
        pushTimer = setTimeout(pushNow, 350);
    }

    function pushNow() {
        if (!castMode) return Promise.resolve();
        return postDisplay('show', castMode === 'rank' ? buildRankPayload() : buildSeatsPayload())
            .then(function (res) {
                if (res && res.ok === false) appAlert({ title: '同步失败', text: res.error || '' });
            })
            .catch(function () { });
    }

    function startCast(mode) {
        castMode = mode;
        setCastPill(mode);
        postDisplay('show', mode === 'rank' ? buildRankPayload() : buildSeatsPayload())
            .then(function (res) {
                if (!res.ok) {
                    castMode = null;
                    setCastPill(null);
                    appAlert({ title: '投屏失败', text: res.error || '' });
                }
            })
            .catch(function (err) {
                castMode = null;
                setCastPill(null);
                appAlert({ title: '投屏失败', text: String(err) });
            });
    }

    showRankBtn.onclick = function () { startCast('rank'); };
    showSeatsBtn.onclick = function () { startCast('seats'); };

    function postDisplay(action, payload) {
        var dev = devSel.value;
        if (!dev) {
            appAlert({ title: '没有可用设备', text: '请先在「设置 → 班级设备」里添加一体机。' });
            return Promise.resolve({ ok: false });
        }

        var fd = new FormData();
        fd.append('csrf_token', csrf);
        fd.append('action', action);
        if (payload) fd.append('payload', JSON.stringify(payload));

        return fetch('/device/' + dev + '/display', {
            method: 'POST', body: fd, headers: { 'X-Requested-With': 'fetch' }
        }).then(function (r) { return r.json(); });
    }

    stopCastBtn.onclick = function () {
        castMode = null;
        clearTimeout(pushTimer);
        postDisplay('hide').then(function (res) {
            if (!res.ok) { appAlert({ title: '停止失败', text: res.error || '' }); return; }
            setCastPill(null);
        });
    };

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    window.addEventListener('resize', function () {
        if (seatCount) renderCanvas();
    });

    load();
})();
</script>
</body>
</html>
